  :root {
    --board: #1c1611;
    --walnut: #6a3c1f;
    --walnut-hi: #8d5630;
    --walnut-lo: #3c1f0e;
    --bakelite: #efe3c6;
    --bakelite-hi: #fcf6e6;
    --bakelite-lo: #cdb98e;
    --ink: #4a3220;
    --ink-soft: rgb(74 50 32 / 0.6);
    --knob: #5a321b;
    --knob-hi: #7b4827;
    --knob-lo: #2e170a;
    --brass: #d1a54e;
    --brass-hi: #f6dd9a;
    --brass-lo: #8c6420;
    --glow: #ffd98a;
    --glow-hot: #fff3cf;
    --glow-edge: #d9852b;
    --cloth: #b98f5a;
    --cloth-lo: #8a6236;
    --ghost: #fffdf4;
    --pill: #2b1a0e;
    --label: "Jost", Futura, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    block-size: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 50% 35%, rgb(255 210 140 / 0.08), transparent 60%),
      var(--board);
    font-family: var(--label);
    color: var(--ink);
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
  }

  :focus-visible {
    outline: 2px solid var(--glow-edge);
    outline-offset: 4px;
  }

  .label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    line-height: 1;
  }

  /* ---------- cabinet ---------- */

  .radio {
    position: relative;
    inline-size: 560px;
    padding: 16px;
    border-radius: 44px 44px 30px 30px;
    background:
      repeating-linear-gradient(92deg, transparent 0 7px, rgb(0 0 0 / 0.07) 7px 9px, transparent 9px 17px, rgb(255 255 255 / 0.04) 17px 18px),
      repeating-linear-gradient(88deg, transparent 0 23px, rgb(0 0 0 / 0.09) 23px 26px),
      linear-gradient(170deg, var(--walnut-hi), var(--walnut) 45%, var(--walnut-lo));
    box-shadow:
      inset 0 2px 0 rgb(255 255 255 / 0.18),
      inset 0 -4px 0 rgb(0 0 0 / 0.35),
      0 30px 44px rgb(0 0 0 / 0.65),
      0 6px 10px rgb(0 0 0 / 0.5);

    &::before, &::after {
      content: "";
      position: absolute;
      inset-block-end: -9px;
      inline-size: 54px;
      block-size: 12px;
      border-radius: 0 0 10px 10px;
      background: linear-gradient(var(--walnut-lo), #22110700);
      background-color: var(--walnut-lo);
    }
    &::before { inset-inline-start: 46px; }
    &::after { inset-inline-end: 46px; }
  }

  .face {
    display: grid;
    gap: 16px;
    padding: 18px 22px 20px;
    border-radius: 30px 30px 18px 18px;
    background:
      radial-gradient(ellipse at 30% 0%, rgb(255 255 255 / 0.55), transparent 55%),
      linear-gradient(175deg, var(--bakelite-hi), var(--bakelite) 40%, var(--bakelite-lo));
    box-shadow:
      inset 0 2px 1px rgb(255 255 255 / 0.9),
      inset 0 -3px 2px rgb(110 80 40 / 0.35),
      0 0 0 1px rgb(60 30 10 / 0.5),
      0 3px 6px rgb(0 0 0 / 0.35);
  }

  /* ---------- dial ---------- */

  .dial {
    --pad: 34px;
    position: relative;
    block-size: 132px;
    border-radius: 66px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 60%, var(--glow-hot), var(--glow) 45%, var(--glow-edge) 100%);
    box-shadow:
      inset 0 0 0 5px var(--brass),
      inset 0 0 0 6px var(--brass-lo),
      inset 0 0 22px rgb(140 70 10 / 0.55),
      0 0 0 3px var(--bakelite-lo),
      0 2px 0 4px rgb(255 255 255 / 0.6);

    &::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: inherit;
      background: linear-gradient(170deg, rgb(255 255 255 / 0.55), transparent 28%);
      pointer-events: none;
    }
  }

  .ghosts {
    position: absolute;
    inset-block: 10px 46px;
    inset-inline: calc(var(--pad) + 30px);
  }

  .ghost {
    --x: 0;
    position: absolute;
    inset-block-start: 0;
    inset-inline-start: calc(var(--x) * 100%);
    inline-size: 54px;
    translate: -50% 0;
    opacity: calc(0.35 + var(--haunt) * 0.65);
    transition: inset-inline-start 400ms ease, opacity 300ms ease;
    filter: drop-shadow(0 0 6px rgb(255 250 230 / 0.9)) drop-shadow(0 4px 3px rgb(130 60 0 / 0.45));

    & svg {
      display: block;
      inline-size: 100%;
      animation: float var(--period) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    & .eye {
      fill: var(--ink);
      transform-box: fill-box;
      transform-origin: center;
      scale: calc(0.8 + var(--spook) * 0.7);
      transition: scale 200ms;
    }
    & .mouth {
      fill: var(--ink);
      transform-box: fill-box;
      transform-origin: center;
      scale: calc(0.4 + var(--spook) * 1.1);
      transition: scale 200ms;
    }

        rotate: var(--tilt);
    &:nth-child(1) { --x: 0; --period: 3.1s; --delay: -0.4s; --tilt: -9deg; }
    &:nth-child(2) { --x: 0.2; --period: 3.7s; --delay: -1.9s; --tilt: 7deg; inline-size: 40px; }
    &:nth-child(3) { --x: 0.8; --period: 3.4s; --delay: -1.1s; --tilt: -4deg; inline-size: 50px; }
    &:nth-child(4) { --x: 1; --period: 4.1s; --delay: -2.6s; --tilt: 12deg; inline-size: 46px; }

    &:nth-child(2) .eyes { translate: -1.5px 0.5px; }
    &:nth-child(3) .eyes { translate: 1.5px -0.5px; }
  }

  [data-voices="2"] .ghost {
    &.loose { opacity: 0; }
    &:nth-child(3) { --x: 1; }
  }

  @keyframes float {
    from { translate: calc(var(--drift) * -6px) calc(var(--drift) * -7px - 1px); rotate: calc(var(--drift) * -6deg); }
    to { translate: calc(var(--drift) * 6px) calc(var(--drift) * 7px + 1px); rotate: calc(var(--drift) * 6deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ghost svg { animation: none; }
  }

  .scale {
    position: absolute;
    inset-block-end: 14px;
    inset-inline: var(--pad);
    block-size: 34px;
    border-block-start: 1.5px solid rgb(74 50 32 / 0.55);

    & .mark {
      position: absolute;
      inset-block-start: 0;
      inset-inline-start: calc(var(--at) * 100%);
      translate: -50% 0;
      display: grid;
      justify-items: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ink);

      &::before {
        content: "";
        inline-size: 1.5px;
        block-size: 7px;
        background: currentcolor;
      }
    }

    & .zone {
      position: absolute;
      inset-block-end: 0;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.24em;
      color: var(--ink-soft);
    }
    & .zone.double { inset-inline-start: 4%; }
    & .zone.slap { inset-inline-end: 2%; }
  }

  .needle {
    position: absolute;
    inset-block: 8px;
    inset-inline-start: calc(var(--pad) + var(--distance) * (100% - 2 * var(--pad)));
    inline-size: 3px;
    translate: -50% 0;
    border-radius: 2px;
    background: linear-gradient(#c62d1a, #8e1a0c);
    box-shadow: 0 0 4px rgb(198 45 26 / 0.6), 1px 0 0 rgb(255 255 255 / 0.35);
    pointer-events: none;
  }

  /* ---------- middle: grille and tuning ---------- */

  .middle {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 22px;
    align-items: center;
  }

  .grille {
    position: relative;
    block-size: 150px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background:
      repeating-linear-gradient(45deg, rgb(0 0 0 / 0.12) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgb(255 255 255 / 0.1) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 40%, var(--cloth), var(--cloth-lo));
    box-shadow:
      inset 0 3px 6px rgb(60 30 5 / 0.6),
      inset 0 0 0 1px rgb(60 30 5 / 0.4),
      0 1px 0 rgb(255 255 255 / 0.8);
    overflow: hidden;

    &::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg,
        transparent 0 14px,
        var(--bakelite-lo) 14px 15px,
        var(--bakelite) 15px 22px,
        var(--bakelite-hi) 22px 23px,
        transparent 23px 37px);
      box-shadow: inset 0 3px 6px rgb(60 30 5 / 0.5);
      filter: drop-shadow(2px 0 2px rgb(60 30 5 / 0.45));
    }
  }

  .badge {
    position: relative;
    display: grid;
    place-items: center;
    padding: 12px 26px;
    border-radius: 999px;
    background: linear-gradient(170deg, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / 0.7),
      inset 0 -2px 0 rgb(0 0 0 / 0.25),
      0 4px 8px rgb(40 20 5 / 0.55);
    rotate: -4deg;

    & .wordmark {
      font-family: "Modak", sans-serif;
      font-size: 46px;
      line-height: 1;
      text-box: trim-both cap alphabetic;
      color: var(--walnut-lo);
      text-shadow: 0 1px 0 rgb(255 255 255 / 0.5), 0 -1px 0 rgb(0 0 0 / 0.2);
    }

    & svg {
      position: absolute;
      inset-block-start: -18px;
      inset-inline-end: -8px;
      inline-size: 36px;
      rotate: 14deg;
      filter: drop-shadow(0 2px 2px rgb(40 20 5 / 0.5));
    }
  }

  :is(.ghost, .badge) {
    & .ink { fill: var(--walnut-lo); }
    & :is(.body, .arm) {
      fill: var(--ghost);
      stroke: var(--walnut-lo);
      stroke-width: 1.5;
      stroke-linejoin: round;
    }
    & .grin { display: none; }
    &.grinning {
      & .grin { display: inline; }
      & .gasp { display: none; }
    }
    & :is(.eye, .mouth) { fill: var(--walnut-lo); }
    & .shine { fill: var(--ghost); }
    & .cheek { fill: rgb(240 130 120 / 0.55); }
  }

  .tuning {
    display: grid;
    justify-items: center;
    gap: 18px;
    inline-size: 150px;
  }

  /* ---------- knobs ---------- */

  .control {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 12px;
  }

  .value {
    position: absolute;
    inset-block-start: calc(100% + 4px);
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--pill);
    color: var(--bakelite-hi);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    translate: 0 -3px;
    transition: opacity 120ms, translate 120ms;
    pointer-events: none;
    z-index: 2;
  }
  .control:is(:hover, :focus-within, .active) .value {
    opacity: 1;
    translate: 0 0;
  }

  .knob {
    position: relative;
    inline-size: var(--size);
    aspect-ratio: 1;
    border-radius: 50%;
    touch-action: none;
    cursor: ns-resize;

    &:focus-visible { outline-offset: 12px; }

    & .skirt, & .cap, & .pointer {
      position: absolute;
      border-radius: 50%;
    }

    & .skirt {
      inset: 0;
      rotate: calc(var(--turn) * 270deg - 135deg);
      background:
        radial-gradient(circle at 50% 50%, transparent 62%, rgb(0 0 0 / 0.45) 100%),
        repeating-conic-gradient(var(--knob) 0 7deg, var(--knob-hi) 7deg 10deg, var(--knob-lo) 10deg 15deg);
      box-shadow: 0 5px 6px rgb(40 20 5 / 0.55), 0 1px 0 rgb(40 20 5 / 0.6);
    }

    & .cap {
      inset: 13%;
      background:
        radial-gradient(circle at 36% 28%, rgb(255 230 190 / 0.4), transparent 50%),
        radial-gradient(circle, var(--knob-hi), var(--knob-lo));
      box-shadow: inset 0 1px 0 rgb(255 230 190 / 0.3), 0 0 0 1px rgb(30 15 5 / 0.6);
    }

    & .pointer {
      inset: 0;
      rotate: calc(var(--turn) * 270deg - 135deg);

      &::before {
        content: "";
        position: absolute;
        inset-inline-start: calc(50% - 2px);
        inset-block-start: 9%;
        inline-size: 4px;
        block-size: 30%;
        border-radius: 2px;
        background: var(--bakelite-hi);
        box-shadow: 0 0 2px rgb(0 0 0 / 0.5);
      }
    }
  }

  .ticks {
    position: absolute;
    inset: -12px;
    pointer-events: none;

    & i {
      position: absolute;
      inset-block: 0;
      inset-inline-start: calc(50% - 0.75px);
      inline-size: 1.5px;
      rotate: var(--a);

      &::before {
        content: "";
        display: block;
        block-size: 6px;
        border-radius: 1px;
        background: var(--ink-soft);
      }
    }
  }

  .tuning .knob .skirt {
    background:
      radial-gradient(circle at 50% 50%, transparent 64%, rgb(0 0 0 / 0.45) 100%),
      repeating-conic-gradient(var(--knob) 0 4deg, var(--knob-hi) 4deg 6deg, var(--knob-lo) 6deg 9deg);
  }

  .tuning .knob .cap {
    background:
      radial-gradient(circle at 36% 28%, rgb(255 255 255 / 0.6), transparent 50%),
      radial-gradient(circle, var(--brass-hi), var(--brass) 55%, var(--brass-lo));
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.5), 0 0 0 2px var(--knob-lo);
  }

  .tuning .knob .pointer::before {
    background: var(--knob-lo);
    box-shadow: none;
  }

  .row {
    display: flex;
    justify-content: space-around;
    align-items: start;
    padding-block-start: 12px;
  }

  /* ---------- voices keys ---------- */

  .keys {
    display: grid;
    justify-items: center;
    gap: 10px;

    & .set {
      display: flex;
      gap: 3px;
      padding: 3px;
      border-radius: 8px;
      background: var(--knob-lo);
      box-shadow: 0 1px 0 rgb(255 255 255 / 0.8), inset 0 1px 3px rgb(0 0 0 / 0.6);
    }

    & button {
      display: grid;
      place-items: center;
      inline-size: 54px;
      block-size: 36px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      color: var(--ink);
      background: linear-gradient(var(--bakelite-hi), var(--bakelite) 60%, var(--bakelite-lo));
      box-shadow: inset 0 1px 0 #fff, 0 4px 0 var(--bakelite-lo), 0 5px 3px rgb(0 0 0 / 0.5);
      translate: 0 -4px;
      transition: translate 80ms, box-shadow 80ms;

      & small {
        display: block;
        font-size: 7px;
        letter-spacing: 0.18em;
        color: var(--ink-soft);
      }

      &[aria-checked="true"] {
        translate: 0 0;
        background: radial-gradient(ellipse at 50% 40%, var(--glow-hot), var(--glow) 60%, var(--glow-edge));
        box-shadow: inset 0 2px 3px rgb(90 40 0 / 0.45), 0 0 10px rgb(255 190 90 / 0.55);
      }
    }
  }
</style>
</head>
<body>
<template id="ghost">
  <svg viewBox="-3 0 54 52">
    <g class="ink" transform="translate(1.6 2)">
      <ellipse cx="5" cy="28" rx="5" ry="3.6" transform="rotate(-28 5 28)"/>
      <ellipse cx="43" cy="28" rx="5" ry="3.6" transform="rotate(28 43 28)"/>
      <path d="M6 25C6 13 14 5 24 5s18 8 18 20v12a5.5 5.5 0 0 1-9 4.3a5.5 5.5 0 0 1-9 0a5.5 5.5 0 0 1-9 0A5.5 5.5 0 0 1 6 37z"/>
    </g>
    <ellipse class="arm" cx="5" cy="28" rx="5" ry="3.6" transform="rotate(-28 5 28)"/>
    <ellipse class="arm" cx="43" cy="28" rx="5" ry="3.6" transform="rotate(28 43 28)"/>
    <path class="body" d="M6 25C6 13 14 5 24 5s18 8 18 20v12a5.5 5.5 0 0 1-9 4.3a5.5 5.5 0 0 1-9 0a5.5 5.5 0 0 1-9 0A5.5 5.5 0 0 1 6 37z"/>
    <ellipse class="cheek" cx="12.5" cy="27" rx="3.2" ry="2"/>
    <ellipse class="cheek" cx="35.5" cy="27" rx="3.2" ry="2"/>
    <g class="eyes">
      <g class="eye"><ellipse cx="17" cy="20" rx="3.4" ry="4.4"/><circle class="shine" cx="18.2" cy="18.3" r="1.3"/></g>
      <g class="eye"><ellipse cx="31" cy="20" rx="3.4" ry="4.4"/><circle class="shine" cx="32.2" cy="18.3" r="1.3"/></g>
    </g>
    <ellipse class="mouth gasp" cx="24" cy="28.5" rx="2.4" ry="2.8"/>
    <path class="mouth grin" d="M20 27.2q4 4.6 8 0z"/>
  </svg>
</template>

<main class="radio" aria-label="Ghosted">
  <div class="face">
    <div class="dial" aria-hidden="true">
      <div class="ghosts">
        <div class="ghost"></div>
        <div class="ghost loose grinning"></div>
        <div class="ghost"></div>
        <div class="ghost loose grinning"></div>
      </div>
      <div class="scale" id="scale">
        <span class="zone double">DOUBLE</span>
        <span class="zone slap">SLAPBACK</span>
      </div>
      <div class="needle"></div>
    </div>

    <div class="middle">
      <div class="grille" aria-hidden="true">
        <div class="badge grinning">
          <span class="wordmark">Ghosted</span>
          
        </div>
      </div>
      <div class="tuning">
        <div class="control" data-knob="distance" style="--size: 92px"></div>
        <div class="keys" data-keys="voices"></div>
      </div>
    </div>

    <div class="row">
      <div class="control" data-knob="haunt" style="--size: 62px"></div>
      <div class="control" data-knob="drift" style="--size: 62px"></div>
      <div class="control" data-knob="spook" style="--size: 62px"></div>
    </div>
  </div>
</main>

<script>
(() => {
  const params = new Map();
  const views = new Map();
  const dragging = new Set();
  const radio = document.querySelector(".radio");
  const ghost = document.getElementById("ghost");
  document.querySelectorAll(".ghost, .badge").forEach((el) => el.append(ghost.content.cloneNode(true)));

  // Distance's host range is skewed: normalized = sqrt((ms - 5) / 145).
  const distanceAt = (ms) => Math.sqrt((ms - 5) / 145);

  const bridge = window.ipc
    ? (msg) => window.ipc.postMessage(JSON.stringify(msg))
    : mockBridge();

  const scale = document.getElementById("scale");
  for (const ms of [5, 10, 20, 40, 80, 150]) {
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.style.setProperty("--at", distanceAt(ms).toFixed(4));
    mark.textContent = ms;
    scale.append(mark);
  }

  // The ghosts in the dial follow the controls: Haunt fades them in,
  // Drift sets how far they wander, Spook widens their eyes, Distance
  // moves the needle and Voices hides the loose pair.
  function decorate(p) {
    if (p.id === "voices") {
      radio.dataset.voices = p.value >= 0.5 ? "4" : "2";
    } else {
      radio.style.setProperty(`--${p.id}`, p.value.toFixed(4));
    }
  }

  function setParam(id, value) {
    const p = params.get(id);
    if (!p) return;
    p.value = Math.min(1, Math.max(0, value));
    bridge({ type: "set", id, value: p.value });
    views.get(id)?.(p);
  }

  function gesture(id, fn) {
    bridge({ type: "begin", id });
    fn();
    bridge({ type: "end", id });
  }

  // ---------- controls ----------

  function buildKnob(host) {
    const id = host.dataset.knob;
    const p = params.get(id);
    if (!p) return;

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = p.name;
    const knob = document.createElement("div");
    knob.className = "knob";
    knob.tabIndex = 0;
    knob.setAttribute("role", "slider");
    knob.setAttribute("aria-label", p.name);
    knob.setAttribute("aria-valuemin", "0");
    knob.setAttribute("aria-valuemax", "1");
    const ticks = document.createElement("div");
    ticks.className = "ticks";
    for (let i = 0; i <= 10; i++) {
      const tick = document.createElement("i");
      tick.style.setProperty("--a", `${i * 27 - 135}deg`);
      ticks.append(tick);
    }
    knob.append(ticks);
    for (const part of ["skirt", "cap", "pointer"]) {
      const el = document.createElement("div");
      el.className = part;
      knob.append(el);
    }
    const value = document.createElement("span");
    value.className = "value";
    host.replaceChildren(knob, label, value);

    views.set(id, (p) => {
      host.style.setProperty("--turn", p.value.toFixed(4));
      knob.setAttribute("aria-valuenow", p.value.toFixed(4));
      knob.setAttribute("aria-valuetext", p.text);
      value.textContent = p.text;
      decorate(p);
    });

    knob.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      knob.setPointerCapture(e.pointerId);
      knob.focus();
      dragging.add(id);
      host.classList.add("active");
      bridge({ type: "begin", id });
      let lastY = e.clientY;
      const move = (ev) => {
        const fine = ev.shiftKey ? 0.15 : 1;
        setParam(id, p.value + ((lastY - ev.clientY) / 200) * fine);
        lastY = ev.clientY;
      };
      const up = () => {
        knob.removeEventListener("pointermove", move);
        knob.removeEventListener("pointerup", up);
        knob.removeEventListener("pointercancel", up);
        dragging.delete(id);
        host.classList.remove("active");
        bridge({ type: "end", id });
      };
      knob.addEventListener("pointermove", move);
      knob.addEventListener("pointerup", up);
      knob.addEventListener("pointercancel", up);
    });

    knob.addEventListener("dblclick", () => gesture(id, () => setParam(id, p.default)));

    knob.addEventListener("keydown", (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir === undefined) return;
      e.preventDefault();
      e.stopPropagation();
      gesture(id, () => setParam(id, p.value + dir * (e.shiftKey ? 0.1 : 0.01)));
    });

    knob.addEventListener("wheel", (e) => {
      e.preventDefault();
      const dir = Math.sign(-e.deltaY);
      if (!dir) return;
      gesture(id, () => setParam(id, p.value + dir * 0.005));
    }, { passive: false });
  }

  function buildKeys(host) {
    const id = host.dataset.keys;
    const p = params.get(id);
    if (!p) return;

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = p.name;
    const set = document.createElement("div");
    set.className = "set";
    set.setAttribute("role", "radiogroup");
    set.setAttribute("aria-label", p.name);
    const keys = p.options.map((option, i) => {
      const key = document.createElement("button");
      key.setAttribute("role", "radio");
      key.append(option);
      const small = document.createElement("small");
      small.textContent = "GHOSTS";
      key.append(small);
      key.addEventListener("click", () => gesture(id, () => setParam(id, i / p.steps)));
      key.addEventListener("keydown", (e) => {
        const dir = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (dir === undefined) return;
        e.preventDefault();
        e.stopPropagation();
        const next = Math.min(p.steps, Math.max(0, i + dir));
        gesture(id, () => setParam(id, next / p.steps));
        keys[next].focus();
      });
      return key;
    });
    set.append(...keys);
    host.replaceChildren(label, set);

    views.set(id, (p) => {
      const selected = Math.round(p.value * p.steps);
      keys.forEach((key, i) => {
        key.setAttribute("aria-checked", String(i === selected));
        key.tabIndex = i === selected ? 0 : -1;
      });
      decorate(p);
    });
  }

  function build() {
    document.querySelectorAll("[data-knob]").forEach(buildKnob);
    document.querySelectorAll("[data-keys]").forEach(buildKeys);
    for (const p of params.values()) views.get(p.id)?.(p);
  }

  // ---------- messages ----------

  addEventListener("pointerdown", () => bridge({ type: "focus" }), true);
  addEventListener("focusin", () => bridge({ type: "keys", active: true }));
  addEventListener("focusout", (e) => {
    if (!e.relatedTarget) bridge({ type: "keys", active: false });
  });

  function forwardKey(msg) {
    const { event, type, ...init } = msg;
    const target = document.activeElement ?? document.body;
    target.dispatchEvent(new KeyboardEvent(event, { ...init, bubbles: true, cancelable: true }));
  }

  window.onPluginMessage = (msg) => {
    switch (msg.type) {
      case "key": return forwardKey(msg);
      case "init":
        params.clear();
        msg.params.forEach((p) => params.set(p.id, { ...p, value: p.default, text: "" }));
        build();
        return;
      case "values":
        for (const { id, value, text } of msg.values) {
          const p = params.get(id);
          if (!p) continue;
          p.text = text;
          if (!dragging.has(id)) p.value = value;
          views.get(id)?.(p);
        }
        return;
    }
  };

  // ---------- browser mock ----------

  // Mirrors the plugin's parameters so the page can be worked on in a
  // browser. Keep it in step with params.rs.
  function mockBridge() {
    const pct = (n) => `${Math.round(n * 100)}%`;
    const specs = [
      { id: "haunt", name: "Haunt", steps: 0, default: 0.5, text: pct },
      { id: "distance", name: "Distance", steps: 0, default: distanceAt(20), text: (n) => `${Math.round(5 + 145 * n * n)} ms` },
      { id: "drift", name: "Drift", steps: 0, default: 0.5, text: pct },
      { id: "spook", name: "Spook", steps: 0, default: 0.5, text: pct },
      { id: "voices", name: "Voices", steps: 1, default: 1, options: ["2", "4"], text: (n) => (n >= 0.5 ? "4" : "2") },
    ];
    const values = Object.fromEntries(specs.map((s) => [s.id, s.default]));
    const send = (msg) => setTimeout(() => window.onPluginMessage(msg));
    const sendValues = (ids) => send({
      type: "values",
      values: ids.map((id) => ({ id, value: values[id], text: specs.find((s) => s.id === id).text(values[id]) })),
    });
    return (msg) => {
      switch (msg.type) {
        case "ready":
          send({ type: "init", params: specs.map(({ text, ...rest }) => ({ options: [], ...rest })) });
          sendValues(specs.map((s) => s.id));
          return;
        case "set":
          values[msg.id] = msg.value;
          sendValues([msg.id]);
          return;
      }
    };
  }

  bridge({ type: "ready" });
})();
</script>
</body>
</html>
